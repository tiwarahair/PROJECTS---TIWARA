<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your new email</title>
  </head>
  <body style="margin:0;padding:0;background:#efebe4">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#efebe4">
      <tr>
        <td align="center" style="padding:40px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fffefb;border-radius:16px">
            <tr>
              <td style="padding:40px;font-family:'Schibsted Grotesk', Helvetica, Arial, sans-serif;color:#1a1714">
                <img src="https://www.tiwarashouse.com/email/logo-crimson.png" alt="Tiwára’s House" height="26" style="display:block;height:26px;width:auto;border:0;color:#8f1112;font-weight:600;font-size:18px" />
                <h1 style="margin:20px 0 0;font-family:'Schibsted Grotesk', Helvetica, Arial, sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:24px;line-height:1.2;color:#1a1714">Confirm your new email</h1>
                <p style="margin:20px 0 0;font-size:15.5px;line-height:1.6">Enter this code to make {{ .NewEmail }} your Tiwára’s House email. It expires in 1 hour.</p>
                <p style="margin:20px 0 0;padding:16px 0;background:#efebe4;border-radius:16px;text-align:center;font-family:'Courier New', monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#1a1714">{{ .Token }}</p>

                <p style="margin:20px 0 0;padding-top:16px;border-top:1px solid #e9e2d3;font-size:13px;line-height:1.55;color:#575045">If you didn’t ask to change your email, reply to this email and we’ll help.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
