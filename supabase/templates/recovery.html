<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0;padding:0;background:#efebe4">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#efebe4">
      <tr>
        <td align="center" style="padding:40px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fffefb;border-radius:16px">
            <tr>
              <td style="padding:40px;font-family:'Schibsted Grotesk', Helvetica, Arial, sans-serif;color:#1a1714">
                <img src="https://www.tiwarashouse.com/email/logo-crimson.png" alt="Tiwára’s House" height="26" style="display:block;height:26px;width:auto;border:0;color:#8f1112;font-weight:600;font-size:18px" />
                <h1 style="margin:20px 0 0;font-family:'Schibsted Grotesk', Helvetica, Arial, sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:24px;line-height:1.2;color:#1a1714">Reset your password</h1>
                <p style="margin:20px 0 0;font-size:15.5px;line-height:1.6">Tap the button to choose a new password. The link expires in 1 hour.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:20px">
                  <tr>
                    <td style="border-radius:999px;background:#8f1112">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 24px;font-family:&#39;Schibsted Grotesk&#39;, Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;line-height:20px;color:#fffefb;text-decoration:none;border-radius:999px">Choose a new password</a>
                    </td>
                  </tr>
                </table>

                <p style="margin:20px 0 0;padding-top:16px;border-top:1px solid #e9e2d3;font-size:13px;line-height:1.55;color:#575045">If you didn’t ask to reset your password, you can ignore this email. Your password won’t change.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
